[project]
name = "pipeline"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch",
    "torchvision",
    "torchaudio",
    "opencv-python",
    "numpy",
    "pandas",
    "matplotlib",
    "tqdm",
    "psutil",
    "gpustat",
    "librosa",
    "soundfile",
    "scipy",
    "pydub",
    "jiwer",
    "lpips",
    "pytorch-fid",
    "transformers>=4.45.0",
    "tokenizers>=0.20.0",
    "diffusers>=0.30.2",
    "mmpose",
    "mmengine",
    # mmcv (full, with CUDA ops) has no Windows wheels at all.
    # mmcv-lite is the pure-Python variant that installs fine on Windows.
    # For mmpose inference this is sufficient; only exotic ops like
    # deformable convolution require the full build.
    "mmcv-lite<2.2.0",
    "mmdet",
    "accelerate",
    "seaborn",
    "tensorboard",
    "scikit-image",
    "imageio",
    "imageio-ffmpeg",
    "speechbrain>=1.0.0",
    "faster-whisper",
    "pystoi",
    "dtw-python",
    "pesq>=0.0.4",
    "pyloudnorm>=0.2.0",
    "insightface",
    "onnx==1.16.1",
    "onnxruntime-gpu==1.20.1",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
    "nvidia-cufft-cu12",
    "ml-dtypes==0.4.0",
    "mediapipe==0.10.14",
    "pingouin",
    "scikit-learn",
    "tyro",
    "omegaconf",
    "einops",
    "moviepy",
    "ffmpeg-python",
    "gdown",
    "albumentations",
    "pykalman",
    "lmdb",
    "colorama",
    "gradio_rangeslider",
    "tensorflow",
    "cv2_enumerate_cameras",
    "opennsfw2",
    "protobuf",
    "pygrabber",
    "customtkinter",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[tool.hatch.metadata]
allow-direct-references = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/nightly/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }

[tool.uv.extra-build-dependencies]
chumpy = ["pip"]
xtcocotools = ["numpy"]

[tool.uv]
prerelease = "allow"
environments = ["sys_platform == 'win32'"]