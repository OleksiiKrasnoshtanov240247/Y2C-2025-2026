[project]
name = "deepfake-research"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "torchvision",
    "torchaudio",
    "opencv-python",
    "numpy",
    "pandas",
    "matplotlib",
    "tqdm",
    "psutil",
    "gpustat",
    "librosa",
    "soundfile",
    "scipy",
    "pydub",
    "jiwer",
    "lpips",
    "pytorch-fid",
    "transformers",
    "diffusers",
    "accelerate",
    "seaborn",
    "tensorboard",
    "scikit-image",
    "imageio",
    "imageio-ffmpeg",
    "transformers>=4.45.0",
    "tokenizers>=0.20.0",
    "speechbrain>=1.0.0",
    "faster-whisper",
    "pystoi",
    "dtw-python",
    "pesq>=0.0.4",
    "pyloudnorm>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatchling.build.targets.wheel]
packages = ["src/deepfake_research"]

[tool.hatch.metadata]
allow-direct-references = true
